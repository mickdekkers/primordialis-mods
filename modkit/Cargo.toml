[package]
name = "modkit"
version = "0.1.0"
edition = "2024"
description = "Framework for Primordialis mods: hooking, hot reloading, settings and game bindings"
license = "MIT"
publish = false

# Versions are pinned in the workspace's Cargo.toml.
[dependencies]
modkit_protocol = { path = "../protocol" }
detour.workspace = true
flate2.workspace = true
zip.workspace = true
toml.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
