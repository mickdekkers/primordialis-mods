# changie (https://changie.dev) keeps the changelog. Each change players would notice gets a fragment
# in .changes/unreleased/ (`changie new`), and the Release workflow batches them into the next version:
# its section of CHANGELOG.md, its release notes, and the version in Cargo.toml and Cargo.lock.
changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## {{.VersionNoPrefix}} ({{.Time.Format "2006-01-02"}})'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body}}'

# `auto` is how much each kind bumps the version when the next one is picked automatically. None is
# `major`: a change players have to act on is rare for a mod, so going to 1.0.0 is left to a person.
kinds:
  - label: Added
    auto: minor
  - label: Changed
    auto: minor
  - label: Removed
    auto: minor
  - label: Fixed
    auto: patch

newlines:
  afterChangelogHeader: 1
  beforeKind: 1
  afterKind: 1
  endOfVersion: 1

# The mod's version lives in Cargo.toml, and Cargo.lock repeats it.
replacements:
  - path: Cargo.toml
    find: '^version = ".*"'
    replace: 'version = "{{.VersionNoPrefix}}"'
  - path: Cargo.lock
    find: '(name = "primordialis_qol"\r?\n)version = ".*"'
    replace: '${1}version = "{{.VersionNoPrefix}}"'
