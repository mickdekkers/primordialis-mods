name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes an older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, so a new Rust release can't change what CI checks. Update it deliberately.
  RUSTUP_TOOLCHAIN: "1.98.1"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --release --locked -- -D warnings

      - name: Test
        run: cargo test --release --locked

  workflows:
    name: Check the workflows
    runs-on: ubuntu-24.04
    env:
      # Official release binaries, checked against the SHA-256 GitHub publishes for each release asset.
      # Update a version and its hash together.
      PINACT_URL: https://github.com/suzuki-shunsuke/pinact/releases/download/v5.0.0/pinact_linux_amd64.tar.gz
      PINACT_SHA256: d005bbb85da80dacdc07816f24a5da723a9f6d1e9f3d3e7e73df33f9caa1358f
      ZIZMOR_URL: https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinact and zizmor
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          install_tool() { # <url> <sha256> <binary in the archive>
            curl --fail --silent --show-error --location "$1" --output "$RUNNER_TEMP/tool.tar.gz"
            echo "$2  $RUNNER_TEMP/tool.tar.gz" | sha256sum --check -
            tar xzf "$RUNNER_TEMP/tool.tar.gz" -C "$bin" "$3"
          }
          install_tool "$PINACT_URL" "$PINACT_SHA256" pinact
          install_tool "$ZIZMOR_URL" "$ZIZMOR_SHA256" zizmor
          echo "$bin" >> "$GITHUB_PATH"

      # Every action is pinned to a full commit SHA, and its version comment names that commit.
      - name: pinact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --check --verify-comment

      # Static analysis of the workflows for security problems, including online checks such as
      # actions with known vulnerabilities.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona=pedantic --format=github .
