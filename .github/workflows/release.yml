name: Release

# Releases the changes recorded in .changes/unreleased: batches them into the next version (its
# changelog section, release notes and version number), builds and tests it, scans the DLL on
# VirusTotal, then pushes the release commit to main and publishes the release. Nothing is pushed or
# published if a step fails. See "Releasing" in DEVELOPMENT.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version: empty to pick it from the kinds of the changes, or major, minor, patch, or a version like 1.0.0"
        type: string
        required: false
        default: ""

permissions:
  contents: read

# One release at a time, and never cancel one halfway.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # Pinned, so a new Rust release can't change what's built. Update it deliberately.
  RUSTUP_TOOLCHAIN: "1.98.1"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Prepare, build and test
    # Releases are made from main only.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      # Check out the files exactly as committed (the runner would convert them to CRLF), so the release
      # commit changes nothing but the version and the changelog.
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal

      - name: Install changie
        env:
          # The official release binary, checked against the SHA-256 GitHub publishes for it. Update the
          # version and hash together.
          CHANGIE_URL: https://github.com/miniscruff/changie/releases/download/v1.26.0/changie_1.26.0_windows_amd64.zip
          CHANGIE_SHA256: 86b1e2851d78be2b52b04c8129442d4fcc8b29edd839bcc893fe66486d72ae72
        run: |
          $zip = Join-Path $env:RUNNER_TEMP changie.zip
          Invoke-WebRequest $env:CHANGIE_URL -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($hash -ne $env:CHANGIE_SHA256) { throw "changie's SHA-256 is $hash, expected $env:CHANGIE_SHA256" }
          $bin = Join-Path $env:RUNNER_TEMP changie
          Expand-Archive $zip -DestinationPath $bin
          $bin >> $env:GITHUB_PATH

      - name: Prepare the release
        id: prepare
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          $bump = if ($env:REQUESTED) { $env:REQUESTED } else { 'auto' }
          if ($bump -notmatch '^(auto|major|minor|patch|\d+\.\d+\.\d+)$') {
            throw "'$bump' isn't a version: leave it empty, or give major, minor, patch, or e.g. 1.0.0."
          }
          # Fails if there are no changes to release.
          changie batch $bump --allow-no-changes=false
          if ($LASTEXITCODE) { throw 'changie batch failed' }
          changie merge
          if ($LASTEXITCODE) { throw 'changie merge failed' }
          $tag = changie latest
          $version = $tag.TrimStart('v')

          # The publishing job links the README's VirusTotal badge to this version's report. Check the
          # badge is there now, before anything is uploaded.
          if (@(Select-String -Path README.md -Pattern '^\[!\[VirusTotal').Count -ne 1) {
            throw 'README.md needs exactly one line starting with the VirusTotal badge.'
          }

          # changie set the version in Cargo.toml and Cargo.lock; --locked fails if they disagree.
          $package = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages |
            Where-Object name -eq primordialis_qol
          if ($package.version -ne $version) {
            throw "Cargo.toml says $($package.version), but the release is $version."
          }

          # The version's changelog section, without its heading, becomes the release notes.
          New-Item -ItemType Directory -Force dist | Out-Null
          $notes = (Get-Content ".changes/$tag.md" | Select-Object -Skip 1) -join "`n"
          Set-Content -Encoding utf8NoBOM dist/changelog.md $notes.Trim()

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .changes Cargo.toml Cargo.lock
          git commit --quiet -m "Release $tag" -m "Batches the changes in .changes/unreleased into CHANGELOG.md, sets the version to $version, and links the README's VirusTotal badge to this version's report."
          if ($LASTEXITCODE) { throw 'git commit failed' }
          # The publishing job pushes this commit, if everything else succeeds.
          git bundle create dist/release.bundle "$env:GITHUB_SHA..HEAD"
          if ($LASTEXITCODE) { throw 'git bundle failed' }
          git show --stat HEAD

          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      # Rust embeds source paths in the DLL, for panic messages. Those include where Cargo and rustup
      # keep their files, in the home folder of whoever built it: map them to neutral names. The tests
      # are built with the same flags, since changing them rebuilds everything: the build then only
      # compiles the mod itself, reusing the dependencies the tests compiled.
      - name: Map local paths
        run: |
          $cargoHome = $env:CARGO_HOME ?? (Join-Path $env:USERPROFILE .cargo)
          $flags = @(
            "--remap-path-prefix=$cargoHome=/cargo"
            "--remap-path-prefix=$(rustup show home)=/rustup"
            "--remap-path-prefix=$env:GITHUB_WORKSPACE=/build"
          ) -join [char]0x1f
          "CARGO_ENCODED_RUSTFLAGS=$flags" >> $env:GITHUB_ENV

      # Nothing is restored from a cache: the release is built from scratch, so what's published can't
      # depend on anything an earlier run left behind.
      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked -p primordialis_qol

      - name: Check the DLL has no local paths
        run: .github/scripts/check-paths.ps1 target/release/primordialis_qol.dll

      - name: Package
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          Copy-Item target/release/primordialis_qol.dll dist/
          Compress-Archive target/release/primordialis_qol.pdb "dist/primordialis_qol-$env:VERSION-debug-symbols.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/
          if-no-files-found: error

  publish:
    name: Scan and publish
    needs: build
    runs-on: ubuntu-24.04
    # The environment holding the VirusTotal key, so that no other job can use it.
    environment: release
    permissions:
      contents: write # to push the release commit and create the release
    env:
      VERSION: ${{ needs.build.outputs.version }}
      COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      # The commit the release was prepared from, which the release commit's bundle builds on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      - name: Scan on VirusTotal
        id: scan
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: bash .github/scripts/virustotal.sh dist/primordialis_qol.dll virustotal.md

      # The DLL's report only exists now, so the release commit gets it here: its README links to the
      # report for the DLL released with it. The README isn't part of the build, so the DLL is still
      # what that commit builds.
      - name: Link the README to the report
        id: readme
        env:
          BADGE: ${{ steps.scan.outputs.badge }}
        run: |
          git fetch --quiet dist/release.bundle HEAD
          if [[ $(git rev-parse FETCH_HEAD) != "$COMMIT" ]]; then
            echo "::error::The bundle doesn't hold the release commit $COMMIT."
            exit 1
          fi
          if [[ -z $BADGE ]]; then
            echo "::error::The VirusTotal scan gave no badge."
            exit 1
          fi
          git checkout --quiet --detach "$COMMIT"
          # README.md has CRLF line endings: write them explicitly, whatever awk does with the CRs it
          # reads. Anything but the badge line changing fails the release.
          awk '{ sub(/\r$/, "") } /^\[!\[VirusTotal/ { $0 = ENVIRON["BADGE"] } { printf "%s\r\n", $0 }' \
            README.md > README.new
          mv README.new README.md
          git diff
          if [[ $(git diff --numstat) != $'1\t1\tREADME.md' ]]; then
            echo "::error::Linking the report changed more of README.md than its VirusTotal badge."
            exit 1
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --amend --no-edit README.md
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Only a fast-forward: if main moved since the build started, this fails and nothing is released.
      - name: Push the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.readme.outputs.commit }}
        run: |
          gh auth setup-git
          git push origin "$RELEASE_COMMIT:refs/heads/main"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN: ${{ steps.scan.outputs.clean }}
          RELEASE_COMMIT: ${{ steps.readme.outputs.commit }}
        run: |
          tag="v$VERSION"
          sha256=$(sha256sum dist/primordialis_qol.dll | cut -d' ' -f1)
          install="https://github.com/$GITHUB_REPOSITORY/blob/$tag/README.md#install"
          {
            printf '%s\n\n' "$(cat dist/changelog.md)"
            echo "### Install"
            echo
            echo "Download \`primordialis_qol.dll\` below and follow the [install steps]($install)."
            echo "The debug symbols are only for investigating crashes."
            echo
            printf '%s\n\n' "$(cat virustotal.md)"
            echo "SHA-256 of \`primordialis_qol.dll\`: \`$sha256\`"
          } > notes.md

          draft=()
          if [[ $CLEAN != true ]]; then
            draft=(--draft)
            echo "::warning::Left the release as a draft: check the VirusTotal report, then publish it by hand."
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" \
            --title "Primordialis QoL $VERSION" --notes-file notes.md "${draft[@]}" \
            dist/primordialis_qol.dll "dist/primordialis_qol-$VERSION-debug-symbols.zip"
