[package]
name = "primordialis_qol"
version = "0.1.0"
edition = "2024"
description = "Primordialis QoL mod: shows cell pickup icons on the map in explored areas"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

# Every dependency is pinned to an exact, reviewed version. Do not loosen these
# without reviewing the new versions (and their dependency trees) first.
[dependencies]
detour = { version = "=0.9.0", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
toml = { version = "=1.1.4", default-features = false, features = ["std", "parse"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[workspace]
members = ["hot_reload"]
# The hot reload host (a development tool) is only built when asked for, with
# `cargo build --release -p primordialis_qol_hot_reload`: while the game runs, it's locked.
default-members = ["."]

[profile.release]
debug = "line-tables-only"
lto = true
codegen-units = 1
