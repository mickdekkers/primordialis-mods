[package]
name = "primordialis_qol"
version = "0.1.0"
edition = "2024"
description = "Primordialis QoL mod: shows the cell pickups you've seen on the map"
license = "MIT"
repository = "https://github.com/mickdekkers/primordialis-mods"
publish = false

[lib]
crate-type = ["cdylib"]

# Gives the DLL its version information (see build.rs).
[build-dependencies]
embed-resource = { workspace = true }

[dependencies]
modkit = { path = "modkit" }
rustc-hash = { workspace = true }
# The cells the player has found, kept in a file (see src/found_cells/store.rs).
postcard = { workspace = true }
serde = { workspace = true }

[workspace]
members = ["modkit", "protocol", "hot_reload"]
# The hot reload host (a development tool) is only built when asked for, with
# `cargo build --release -p primordialis_qol_hot_reload`: while the game runs, it's locked.
default-members = [".", "modkit", "protocol"]

# Every external dependency is pinned to an exact, reviewed version. Do not loosen these
# without reviewing the new versions (and their dependency trees) first.
[workspace.dependencies]
detour = { version = "=0.9.0", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
toml = { version = "=1.1.4", default-features = false, features = ["std", "parse"] }
windows-sys = { version = "=0.61.2" }
embed-resource = { version = "=3.0.11" }
rustc-hash = { version = "=2.1.3", default-features = false, features = ["std"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.229", default-features = false, features = ["alloc", "derive"] }

[profile.release]
debug = "line-tables-only"
lto = true
codegen-units = 1
